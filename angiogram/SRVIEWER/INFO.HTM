<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <style type="text/css">
        .imageholder {
                position:relative;
                display:table;
                height: 100%;
                width: 100%;
                vertical-align: middle;
                text-align: center;
        }
        .inner {
                width:100%;
                display:table-cell;
                vertical-align:middle;
                position:relative;
        }
        * html .inner {top:50%;left:0;}
        * html .inner img{top:-50%; position:relative;}
    </style>
</head>

<!-- P3 CUI color for background -->
<body style="background-color: #BABECC;">
<div class="imageholder">
  <div class="inner">
    <img src="JARS/IMAGE/SPLASH.PNG" alt="Reporting Tool"/>
  </div>
</div>
</body>
</html>
